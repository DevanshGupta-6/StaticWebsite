<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thenkewww</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="peach-hugging-goma-cat-b2in79tgixmqrlo1.gif" alt="Lessgoo">
        </div>
        <h1>IT'S A DATE</h1>
    </div>
    <style>
        .container h1{
            color: #36013F;
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 70px;
        }
        .notification{
            position: absolute;
            top: 10px;
            left: 80vw;
            width: 250px;
            height: 50px;
        }
        .notification button{
            width: 230px;
            border: 3px solid #36013F;
            height: 40px;
            border-radius: 7px;
            background-color: #f17ffb;
            color: #27022e;
            font-size: 20px;
        }
        .notification img{
            width: 30px;
            position: relative;
            top: -50px;
            left: 210px;
            z-index: 2;
        }

        .popup{
            position: relative;
            display: none;
            width: 35vw;
            height: 75vh;
            background-color: #f17ffb;
            overflow-x: hidden;
            overflow-y: scroll;
        }
        .topbar{
            width: 100vw; 
            height: 30px; 
            position: sticky; 
            top: 0.01px; 
            background-color: #a410a9;
        }
        
        .visiblePopup{
            display: block;
            left: 0vw;
            top: -50vh;
        }
    </style>
    <script >
        document.addEventListener('DOMContentLoaded', ()=>{
            const notif = document.querySelector('.notification')
            const popup = document.querySelector('.popup')
            const close = document.querySelector('.close')
            notif.addEventListener('click', ()=>{
                popup.classList.toggle('visiblePopup')
            })
        })
        
    </script>
</body>
</html>
